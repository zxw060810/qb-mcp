name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 重跑接口审计，上游改接口时主动报警
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Class A: offline behaviour tests across supported Python versions ----
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      # Fail fast if the interpreter is not the clean shape we think it is
      # (mcp major version, package resolves to this checkout, test count).
      - name: Environment gate
        run: python scripts/env_check.py --env A --no-net --expect-tests 303

      - name: "Class A - offline behaviour"
        run: pytest -q --ignore=tests/live --cov=qb_mcp --cov-report=term-missing

  # -- The mcp SDK has two majors; both must keep working --------------------
  mcp-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp==1.28.1", "mcp"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" && pip install "${{ matrix.mcp }}"
      - name: Report the resolved SDK version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: "Offline suite against ${{ matrix.mcp }}"
        run: pytest -q --ignore=tests/live tests/test_transport.py tests/test_entry.py tests/test_capability.py

  # -- Weekly contract audit: does upstream still match our table? -----------
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-audit every supported tag
        run: python scripts/audit_compat.py --out /tmp/compat.json
      - name: Compare with the committed contract
        run: |
          python - <<'PY'
          import json, sys
          old = json.load(open("docs/compatibility.json"))["tags"]
          new = json.load(open("/tmp/compat.json"))["tags"]
          old_by = {row["tag"]: row for row in old}
          diffs = []
          for row in new:
              seen = old_by.get(row["tag"])
              if seen is None:
                  diffs.append(f"{row['tag']}: new tag, not in the committed table")
              elif seen != row:
                  keys = [k for k in row if seen.get(k) != row[k]]
                  diffs.append(f"{row['tag']}: {', '.join(keys)} changed")
          if diffs:
              print("\n".join(diffs))
              print("::error::upstream changed; regenerate docs/compatibility.json")
              sys.exit(1)
          print("contract still matches upstream")
          PY

  # -- One-off helper: which qBittorrent image tags actually exist -----------
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate image tags
        run: |
          for v in 4.6.7 5.1.4 5.2.4 5.3.0; do
            for cand in \
              "qbittorrentofficial/qbittorrent-nox:$v" \
              "qbittorrentofficial/qbittorrent-nox:release-$v" \
              "qbittorrentofficial/qbittorrent-nox:v$v" \
              "linuxserver/qbittorrent:$v" \
              "linuxserver/qbittorrent:version-$v" \
              "ghcr.io/hotio/qbittorrent:release-$v"; do
              if docker manifest inspect "$cand" >/dev/null 2>&1; then
                echo "OK   $cand"
              else
                echo "MISS $cand"
              fi
            done
          done
          echo "--- tags published by qbittorrentofficial ---"
          docker manifest inspect qbittorrentofficial/qbittorrent-nox:latest >/dev/null 2>&1 && echo "latest OK"

  # -- Class B: the only job that talks to a real qBittorrent ---------------
  # One container per audited generation (see docs/compatibility.json).
  # Any failure here means a belief encoded in Class A has gone stale, so it
  # is not treated as flaky.
  live:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 四段分叉各取一个 tag：4.6.x / 5.0-5.1 / 5.2.x / 5.3.x
        qb_version: ["4.6.7", "5.1.4", "5.2.4", "5.3.0"]
    name: "live qBittorrent ${{ matrix.qb_version }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"

      - name: Start qBittorrent ${{ matrix.qb_version }}
        run: |
          docker run -d --name qb -p 8080:8080 \
            -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC \
            linuxserver/qbittorrent:${{ matrix.qb_version }}
          ready=no
          for i in $(seq 180); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "WebUI answered HTTP $code after ${i}s"
              ready=yes
              break
            fi
            sleep 1
          done
          if [ "$ready" != "yes" ]; then
            echo "::error::container did not answer within 180s"
            docker logs qb 2>&1 | tail -40
            exit 1
          fi
          echo "--- container log ---"
          docker logs qb 2>&1 | tail -30

      - name: Resolve temporary password
        id: qbpass
        run: |
          PW=$(docker logs qb 2>&1 \
               | grep -i "temporary password" \
               | tail -1 \
               | sed -E 's/.*session: *//' \
               | tr -d '\r' | tr -d ' ')
          if [ -z "$PW" ]; then
            echo "::error::temporary password not found in container log"
            docker logs qb 2>&1 | tail -40
            exit 1
          fi
          echo "::add-mask::$PW"
          echo "value=$PW" >> "$GITHUB_OUTPUT"

      - name: "Class B - live qBittorrent ${{ matrix.qb_version }}"
        env:
          QB_TEST_URL: http://127.0.0.1:8080
          QB_TEST_USER: admin
          QB_TEST_PASS: ${{ steps.qbpass.outputs.value }}
        run: pytest tests/live -q -rs

      - name: Container log and torrent dump on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker logs qb > artifacts/container-${{ matrix.qb_version }}.log 2>&1 || true
          curl -s http://127.0.0.1:8080/api/v2/torrents/info > artifacts/torrents-${{ matrix.qb_version }}.json || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-failure-${{ matrix.qb_version }}
          path: artifacts/
