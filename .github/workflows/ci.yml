name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -- Class A: offline behaviour tests across supported Python versions ----
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      # Fail fast if the interpreter is not the clean shape we think it is
      # (mcp major version, package resolves to this checkout, test count).
      - name: Environment gate
        run: python scripts/env_check.py --env A --no-net --expect-tests 69

      - name: "Class A - offline behaviour"
        run: pytest -q --ignore=tests/live --cov=qb_mcp --cov-report=term-missing

  # -- Class B: the only job that talks to a real qBittorrent ---------------
  # Runs on main only. Any failure here means a belief encoded in Class A has
  # gone stale, so it is not treated as flaky.
  live:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"

      - name: Start qBittorrent container
        run: |
          docker run -d --name qb -p 8080:8080 \
            qbittorrentofficial/qbittorrent-nox:latest
          for i in $(seq 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "WebUI answered HTTP $code after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- container log ---"
          docker logs qb 2>&1 | tail -30

      - name: Resolve temporary password
        id: qbpass
        run: |
          PW=$(docker logs qb 2>&1 \
               | grep -i "temporary password" \
               | tail -1 \
               | sed -E 's/.*session: *//' \
               | tr -d '\r' | tr -d ' ')
          if [ -z "$PW" ]; then
            echo "::error::temporary password not found in container log"
            docker logs qb 2>&1 | tail -40
            exit 1
          fi
          echo "::add-mask::$PW"
          echo "value=$PW" >> "$GITHUB_OUTPUT"

      - name: "Class B - live qBittorrent"
        env:
          QB_TEST_URL: http://127.0.0.1:8080
          QB_TEST_USER: admin
          QB_TEST_PASS: ${{ steps.qbpass.outputs.value }}
        run: pytest tests/live -q -rs

      - name: Container log on failure
        if: failure()
        run: docker logs qb 2>&1 | tail -60
